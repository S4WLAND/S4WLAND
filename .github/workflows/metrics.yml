name: Generate profile metrics

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/languages-card.mjs"
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render languages card
        run: node .github/scripts/languages-card.mjs
        env:
          # Fine-grained PAT: all repositories, "Metadata: Read-only" only.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          IGNORED_LANGUAGES: PHP
          OUTPUT: metrics.svg

      - name: Commit card
        run: |
          git add metrics.svg
          if git diff --cached --quiet; then
            echo "metrics.svg unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(metrics): update languages card"
          git push
