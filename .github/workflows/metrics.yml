name: Generate profile metrics

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Fine-grained PAT: all repositories, "Metadata: Read-only" only.
          # Enough for private repository languages and counts; it cannot read code.
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          user: S4WLAND
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Argentina/Buenos_Aires
          config_display: large
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_ignored: php
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
