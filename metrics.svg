<svg xmlns="http://www.w3.org/2000/svg" width="540" height="224" viewBox="0 0 540 224" role="img" aria-label="Most used languages">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #00FF7F; }
